name: Deploy to EC2

on: 
  push:
    branches:
      - prd

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            cd ~/frontend

            echo "pull latest code"
            git pull origin prd

            echo "install dependencies"
            npm install

            echo "Build"
            npm run build

            echo "Reload server"
            pm2 reload dshelper || pm2 start dshelper
